<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f1f2f5">
<title>我的资产</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="phone">

  <!-- ===== 首页 ===== -->
  <section id="view-home" class="view active">
    <header class="hero">
      <div class="hero-blob blob1"></div>
      <div class="hero-blob blob2"></div>
      <div class="hero-top">
        <div class="hero-title">我的资产 <span id="itemCount" class="hero-count"></span></div>
        <div class="hero-actions">
          <button class="pill-btn" id="searchBtn" title="搜索" aria-label="搜索">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
          <button class="pill-btn pill-btn-solid" id="addBtn">添加</button>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-label">总资产</div>
          <div class="hero-stat-value" id="totalAssets">¥0.00</div>
        </div>
        <div class="hero-divider"></div>
        <div class="hero-stat">
          <div class="hero-stat-label">总日均</div>
          <div class="hero-stat-value" id="totalDaily">¥0.00</div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-filter="all">全部</button>
        <button class="tab" data-filter="active">使用中</button>
        <button class="tab" data-filter="favorite">收藏中</button>
      </div>
      <div class="sort-group">
        <select id="sortField" class="sort-select" aria-label="排序字段">
          <option value="date">按添加</option>
          <option value="days">按天数</option>
          <option value="price">按单价</option>
          <option value="daily">按日均</option>
        </select>
        <button class="icon-btn" id="sortDir" title="切换排序方向" aria-label="切换排序方向">
          <svg viewBox="0 0 24 24"><path d="M7 4v16M7 4l-3 3M7 4l3 3M17 20V4M17 20l-3-3M17 20l3-3"/></svg>
        </button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" hidden>
      <p>还没有记录任何物品</p>
      <button class="pill-btn pill-btn-solid" id="emptyAddBtn">添加第一件物品</button>
    </div>
  </section>

  <!-- ===== 统计 ===== -->
  <section id="view-stats" class="view">
    <header class="page-header">
      <div class="page-title">统计</div>
    </header>
    <div class="stats-body">
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-card-label">物品总数</div>
          <div class="stat-card-value" id="statCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">总资产</div>
          <div class="stat-card-value" id="statTotal">¥0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">总日均</div>
          <div class="stat-card-value" id="statDaily">¥0</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-label">件均价值</div>
          <div class="stat-card-value" id="statAvg">¥0</div>
        </div>
      </div>
      <div class="chart-panel">
        <div class="chart-title">日均花费排行</div>
        <div class="bar-list" id="barList"></div>
      </div>
    </div>
  </section>

  <!-- ===== 我的 ===== -->
  <section id="view-profile" class="view">
    <header class="page-header">
      <div class="page-title">我的</div>
    </header>
    <div class="profile-body">
      <div class="profile-group">
        <button type="button" class="profile-row" id="exportBtn">
          <span>导出数据 (JSON)</span>
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="profile-row" id="importBtn">
          <span>导入数据 (JSON)</span>
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <div class="profile-group">
        <button type="button" class="profile-row danger" id="clearBtn">
          <span>清空所有数据</span>
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </section>

  <!-- ===== 底部导航 ===== -->
  <nav class="tabbar">
    <button class="tab-item active" data-view="home">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span>资产</span>
    </button>
    <button class="tab-item" data-view="stats">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 4"/></svg>
      <span>统计</span>
    </button>
    <button class="tab-item" data-view="favorite">
      <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.5 4a5 5 0 0 1 6.5 2 5 5 0 0 1 6.5-2C22 4.5 23.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>
      <span>收藏</span>
    </button>
    <button class="tab-item" data-view="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<!-- ===== 添加/编辑弹层 ===== -->
<div class="modal-mask" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <span id="modalTitle">添加物品</span>
      <button type="button" class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
    </div>
    <form id="itemForm">
      <label class="field">
        <span>名称</span>
        <input type="text" id="fName" required placeholder="例如：iPhone 15">
      </label>
      <label class="field">
        <span>价格 (¥)</span>
        <input type="number" inputmode="decimal" id="fPrice" required min="0" step="0.01" placeholder="0.00">
      </label>
      <label class="field">
        <span>购买日期</span>
        <input type="date" id="fDate" required>
      </label>
      <label class="field">
        <span>分类图标</span>
        <select id="fIcon"></select>
      </label>
      <div class="field-row">
        <label class="switch-field">
          <span>使用中</span>
          <input type="checkbox" id="fActive" checked>
        </label>
        <label class="switch-field">
          <span>收藏</span>
          <input type="checkbox" id="fFavorite">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-delete" id="deleteBtn" hidden>删除</button>
        <button type="submit" class="btn-save">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
